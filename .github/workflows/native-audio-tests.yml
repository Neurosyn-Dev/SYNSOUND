name: Native Android validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - '.github/workflows/native-audio-tests.yml'
  push:
    branches:
      - main
      - native-offline-wav-analysis
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - '.github/workflows/native-audio-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests-and-debug-build:
    name: WAV parser tests and Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run JVM unit tests and build Android debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK for device smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: synsound-native-wav-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
