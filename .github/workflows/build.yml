name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        run: gradle test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          if-no-files-found: warn

  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Create CI debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: gradle assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/debug.keystore
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSWORD: android

      - name: Verify release APK exists
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)" || {
            echo "::error::Gradle completed but produced no APK in app/build/outputs/apk/release"
            exit 1
          }

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: synsound-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Create CI debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: gradle assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/debug.keystore
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSWORD: android

      - name: Get version name
        id: version
        shell: bash
        run: echo "VERSION_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Locate and rename APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::No release APK found. Files produced by Gradle:"
            find app/build/outputs -type f -print || true
            exit 1
          fi
          cp "$apk" "SynSound-${VERSION_NAME}-release.apk"
          echo "Release asset prepared: SynSound-${VERSION_NAME}-release.apk (from $apk)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SynSound-${{ steps.version.outputs.VERSION_NAME }}-release.apk
          generate_release_notes: true
          name: SynSound ${{ steps.version.outputs.VERSION_NAME }}
