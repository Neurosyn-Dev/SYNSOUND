name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        run: gradle test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          if-no-files-found: warn

  build:
    name: Build unsigned release APK for CI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Verify expected unsigned APK exists
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::Expected unsigned release APK not found: $apk"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          test -s "$apk"

      - name: Upload unsigned build artifact for CI
        uses: actions/upload-artifact@v4
        with:
          name: synsound-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 90

  release:
    name: Sign and publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag matches app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          tag_name="${GITHUB_REF#refs/tags/}"
          if [[ -z "$version_name" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$tag_name" != "v$version_name" ]]; then
            echo "::error::Release tag $tag_name does not match app version v$version_name"
            exit 1
          fi
          echo "VERSION_NAME=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Download the tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: synsound-release-apk
          path: release-apk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Require configured release-signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the stable release keystore and credentials before tagging a release."
              exit 1
            fi
          done

      - name: Align, sign, and verify APK
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          unsigned_apk="release-apk/app-release-unsigned.apk"
          aligned_apk="release-apk/app-release-aligned.apk"
          output_apk="SynSound-${VERSION_NAME}-release.apk"
          keystore="$RUNNER_TEMP/synsound-release.jks"

          test -s "$unsigned_apk" || {
            echo "::error::Downloaded build artifact is missing or empty: $unsigned_apk"
            exit 1
          }

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 "$unsigned_apk" "$aligned_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"
          rm -f "$keystore"

      - name: Publish signed APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SynSound-${{ steps.version.outputs.VERSION_NAME }}-release.apk
            SynSound-${{ steps.version.outputs.VERSION_NAME }}-release.apk.sha256
          generate_release_notes: true
          name: SynSound ${{ steps.version.outputs.VERSION_NAME }}
