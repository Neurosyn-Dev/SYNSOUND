Summary: AI-powered acoustic analysis & sound synthesis app
Description: |-
  SynSound is an AI-powered acoustic analysis and sound synthesis application.
  It provides real-time audio visualization, acoustic event detection, and a cloud-connected SDK for advanced sound processing.

  Features include:

  * Real-time acoustic event detection
  * Audio visualizer with waveform display
  * Cloud-connected REST client for sound analysis
  * DSP filters for audio processing
  * WebView-based UI for a rich interactive experience

  The app is a lightweight WebView wrapper backed by a native Android SDK
  that handles audio permissions, microphone access, and real-time DSP.

  No ads. No tracking. No analytics SDKs. 100% open source.

  The Android application currently connects to the SynSound web service hosted
  on Base44. This service is proprietary and the service endpoint is fixed in
  the application, so the corresponding F-Droid AntiFeatures are declared above.

